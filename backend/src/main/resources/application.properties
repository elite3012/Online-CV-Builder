# Server Configuration
server.port=${SERVER_PORT:8081}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# to avoid postgres default user table
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS:3636000}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.sameSite=${AUTH_COOKIE_SAME_SITE:Strict}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Rate Limiter Configuration
auth.login.maxAttempts=5
auth.login.windowMs=60000
auth.login.blockMs=120000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.cvbuilder=${APP_LOG_LEVEL:INFO}

# AI Service
ai.service.enabled=${AI_SERVICE_ENABLED:true}
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.timeoutMs=${AI_SERVICE_TIMEOUT_MS:2500}
ai.service.importTimeoutMs=${AI_SERVICE_IMPORT_TIMEOUT_MS:20000}
