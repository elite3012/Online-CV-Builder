spring.datasource.url=jdbc:h2:mem:cvbuilder-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true
spring.flyway.enabled=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.com.cvbuilder=INFO
jwt.secret=test-secret-key-for-jwt-signing-that-is-long-enough-123456789
app.cors.allowed-origins=http://localhost:5173
auth.login.maxAttempts=3
auth.login.windowMs=60000
auth.login.blockMs=120000
